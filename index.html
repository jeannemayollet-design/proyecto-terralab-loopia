<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Prototipo Didáctico 3D - Plástico Reciclado HDPE</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-container {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 100;
            pointer-events: none;
        }
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            pointer-events: auto;
            max-width: 260px;
        }
        h1 {
            font-size: 1rem;
            margin: 0 0 4px 0;
            color: #4eefb6;
        }
        p {
            font-size: 0.75rem;
            margin: 0;
            color: #e0e0e0;
            line-height: 1.3;
        }
        #controls {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            border-radius: 24px;
            backdrop-filter: blur(5px);
            max-width: 95vw;
        }
        button {
            background: #4eefb6;
            color: #0f172a;
            border: none;
            padding: 8px 12px;
            border-radius: 16px;
            font-weight: bold;
            font-size: 0.7rem;
            cursor: pointer;
        }
        #info-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 100;
            display: none;
            max-width: 250px;
        }
        .highlight {
            color: #ffd166;
            font-weight: bold;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-container">
        <div class="card">
            <h1>Muebles Didácticos HDPE</h1>
            <p>Toca cualquier objeto para ver sus especificaciones técnicas.</p>
        </div>
    </div>

    <div id="info-modal" class="card">
        <h1 id="info-title">Detalle</h1>
        <div id="info-content"></div>
    </div>

    <div id="controls">
        <button id="btn-stool">Banquito</button>
        <button id="btn-letters">Letras</button>
        <button id="btn-shapes">Encaje</button>
        <button id="btn-animate">Elevar / Bajar</button>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#1a1a2e');

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 20, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(15, 25, 15);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(60, 60),
            new THREE.MeshStandardMaterial({ color: 0x252840, roughness: 0.8 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.1;
        floor.receiveShadow = true;
        scene.add(floor);

        function createTerrazzoTexture(baseColorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = baseColorHex;
            ctx.fillRect(0, 0, 512, 512);
            const colors = ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93', '#ffffff'];
            for (let i = 0; i < 400; i++) {
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 6 + 2, 0, Math.PI * 2);
                ctx.fill();
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        const matBlue = new THREE.MeshStandardMaterial({ map: createTerrazzoTexture('#1e3d59'), roughness: 0.3 });
        const matYellow = new THREE.MeshStandardMaterial({ map: createTerrazzoTexture('#f5af19'), roughness: 0.3 });
        const matRed = new THREE.MeshStandardMaterial({ map: createTerrazzoTexture('#e63946'), roughness: 0.3 });
        const matGreen = new THREE.MeshStandardMaterial({ map: createTerrazzoTexture('#2a9d8f'), roughness: 0.3 });
        const matOrange = new THREE.MeshStandardMaterial({ map: createTerrazzoTexture('#f4a261'), roughness: 0.3 });
        const matBoard = new THREE.MeshStandardMaterial({ map: createTerrazzoTexture('#a8dede'), roughness: 0.4 });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const interactiveObjects = [];

        // 1. BANQUITO (Patas Gruesas y seguras)
        const stoolGroup = new THREE.Group();
        stoolGroup.position.set(-8, 0, 0);
        const seat = new THREE.Mesh(new THREE.BoxGeometry(6, 0.8, 6), matBlue);
        seat.position.y = 4;
        seat.castShadow = true;
        stoolGroup.add(seat);

        const legGeo = new THREE.CylinderGeometry(0.75, 0.75, 4, 16);
        [[-2.2, 2, -2.2], [2.2, 2, -2.2], [-2.2, 2, 2.2], [2.2, 2, 2.2]].forEach(pos => {
            const leg = new THREE.Mesh(legGeo, matYellow);
            leg.position.set(...pos);
            leg.castShadow = true;
            stoolGroup.add(leg);
        });
        stoolGroup.userData = {
            title: "Banquito de Preescolar",
            details: `• <span class="highlight">Peso:</span> 3 kg<br>• <span class="highlight">Plástico HDPE:</span> 3.3 kg<br>• <span class="highlight">Equivalencia:</span> ~900 tapitas`
        };
        scene.add(stoolGroup);
        interactiveObjects.push(seat);

        // 2. TABLERO DE ENCAJE Y FICHAS (Tamaño corregido)
        const puzzleGroup = new THREE.Group();
        puzzleGroup.position.set(6, 0.4, -4);

        const boardShape = new THREE.Shape();
        boardShape.moveTo(-4, -4); boardShape.lineTo(4, -4); boardShape.lineTo(4, 4); boardShape.lineTo(-4, 4); boardShape.closePath();

        const holeTri = new THREE.Path();
        holeTri.moveTo(-2.2, 1.2); holeTri.lineTo(-0.8, 1.2); holeTri.lineTo(-1.5, 2.8); holeTri.closePath();
        boardShape.holes.push(holeTri);

        const holeCirc = new THREE.Path();
        holeCirc.absarc(1.5, 2, 0.8, 0, Math.PI * 2, true);
        boardShape.holes.push(holeCirc);

        const holeSq = new THREE.Path();
        holeSq.moveTo(-2.2, -2.5); holeSq.lineTo(-0.8, -2.5); holeSq.lineTo(-0.8, -1.1); holeSq.lineTo(-2.2, -1.1); holeSq.closePath();
        boardShape.holes.push(holeSq);

        const holeRect = new THREE.Path();
        holeRect.moveTo(0.7, -2.5); holeRect.lineTo(2.3, -2.5); holeRect.lineTo(2.3, -1.3); holeRect.lineTo(0.7, -1.3); holeRect.closePath();
        boardShape.holes.push(holeRect);

        const boardMesh = new THREE.Mesh(new THREE.ExtrudeGeometry(boardShape, { depth: 0.8, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.05 }), matBoard);
        boardMesh.rotation.x = -Math.PI / 2;
        boardMesh.castShadow = true;
        puzzleGroup.add(boardMesh);

        const shapesGroup = new THREE.Group();
        
        // Triángulo ajustado al tamaño del molde
        const triShape = new THREE.Shape();
        triShape.moveTo(-0.65, -0.6); triShape.lineTo(0.65, -0.6); triShape.lineTo(0, 0.75); triShape.closePath();
        const triMesh = new THREE.Mesh(new THREE.ExtrudeGeometry(triShape, { depth: 0.76 }), matRed);
        triMesh.rotation.x = -Math.PI / 2; 
        triMesh.position.set(-1.5, 0, -2);
        shapesGroup.add(triMesh);

        const circMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.75, 0.76, 32), matGreen);
        circMesh.position.set(1.5, 0, -2);
        shapesGroup.add(circMesh);

        const sqMesh = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.76, 1.3), matYellow);
        sqMesh.position.set(-1.5, 0, 1.8);
        shapesGroup.add(sqMesh);

        const rectMesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.76, 1.1), matOrange);
        rectMesh.position.set(1.5, 0, 1.9);
        shapesGroup.add(rectMesh);

        puzzleGroup.add(shapesGroup);

        const puzzleInfo = {
            title: "Set de Encaje Geométrico",
            details: `• <span class="highlight">Peso por ficha:</span> 50 g (200 g total)<br>• <span class="highlight">Tablero:</span> 500 g<br>• <span class="highlight">Plástico Total:</span> 800 g`
        };
        boardMesh.userData = puzzleInfo;
        triMesh.userData = puzzleInfo; circMesh.userData = puzzleInfo; sqMesh.userData = puzzleInfo; rectMesh.userData = puzzleInfo;
        scene.add(puzzleGroup);
        interactiveObjects.push(boardMesh, triMesh, circMesh, sqMesh, rectMesh);

        // 3. LETRAS Y NÚMEROS
        const loader = new THREE.FontLoader();
        const lettersGroup = new THREE.Group();
        lettersGroup.position.set(0, 0, 6);

        loader.load('https://threejs.org/examples/fonts/helvetiker_bold.typeface.json', function (font) {
            ['A', 'B', 'C', '1', '2', '3'].forEach((char, index) => {
                const mesh = new THREE.Mesh(
                    new THREE.TextGeometry(char, { font: font, size: 1.2, height: 0.4, curveSegments: 4 }),
                    [matRed, matYellow, matGreen, matBlue, matOrange][index % 5]
                );
                mesh.position.set((index - 2.5) * 2, 0, 0);
                mesh.castShadow = true;
                mesh.userData = {
                    title: `Letra / Número (${char})`,
                    details: `• <span class="highlight">Peso:</span> 20 g<br>• <span class="highlight">Plástico:</span> 23 g<br>• <span class="highlight">Equivalencia:</span> 9 tapitas`
                };
                lettersGroup.add(mesh);
                interactiveObjects.push(mesh);
            });
        });
        scene.add(lettersGroup);

        // Eventos táctiles
        const modal = document.getElementById('info-modal');
        const modalTitle = document.getElementById('info-title');
        const modalContent = document.getElementById('info-content');

        function handlePointer(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveObjects);
            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                if (data && data.title) {
                    modalTitle.innerText = data.title;
                    modalContent.innerHTML = data.details;
                    modal.style.display = 'block';
                }
            }
        }

        window.addEventListener('click', (e) => handlePointer(e.clientX, e.clientY));
        window.addEventListener('touchend', (e) => {
            if (e.changedTouches.length > 0) {
                handlePointer(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }
        });

        let shapesElevated = false;
        document.getElementById('btn-animate').addEventListener('click', () => {
            new TWEEN.Tween(shapesGroup.position)
                .to({ y: shapesElevated ? 0 : 2.2 }, 1000)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();
            shapesElevated = !shapesElevated;
        });

        function moveCamera(x, y, z, tx, ty, tz) {
            new TWEEN.Tween(camera.position).to({ x, y, z }, 1200).easing(TWEEN.Easing.Quadratic.Out).start();
            new TWEEN.Tween(controls.target).to({ x: tx, y: ty, z: tz }, 1200).easing(TWEEN.Easing.Quadratic.Out).start();
        }

        document.getElementById('btn-stool').addEventListener('click', () => moveCamera(-8, 8, 12, -8, 2, 0));
        document.getElementById('btn-letters').addEventListener('click', () => moveCamera(0, 6, 14, 0, 0, 6));
        document.getElementById('btn-shapes').addEventListener('click', () => moveCamera(6, 10, 5, 6, 0, -4));

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
